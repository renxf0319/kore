name: Release

# 推送 v* 标签（如 v0.3.1）即自动构建安装包并附到 GitHub Release。
# 也可在 Actions 页面手动 Run workflow 触发。
#
# 开发阶段当前**只构建 Windows**（出 .exe 与 .msi），这样单次构建从
# 三平台并行变成一个 runner，几十秒就能拿到包，方便反复验证。
# 等功能稳定要对外发版时，把下面注释掉的 macos / ubuntu 两行恢复即可。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # - platform: ubuntu-22.04
          #   args: ''
          # - platform: macos-latest
          #   args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        shell: bash
        # 说明：package-lock.json 若在单一平台生成，只会固化该平台的原生 optional 依赖
        # （esbuild/rollup 的平台二进制，npm bug #4828），导致其它平台构建时找不到原生模块。
        # 因此这里删除 lock，让每个 runner 按自身平台重新解析安装。
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build app and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Kore v__VERSION__'
          releaseBody: 'Windows 安装包（.exe 双击安装 / .msi 供企业部署）。下载后安装即可使用，无云同步。'
          # 开发阶段直接发布（不建草稿），方便直接点下载链接取包
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
